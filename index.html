<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b1b">
  <title>THANK YOU</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #070914; }
    body {
      margin: 0; min-height: 100vh; padding: 30px 18px 20px;
      background:
        radial-gradient(ellipse at 50% 12%, rgba(94, 43, 151, .48), transparent 42%),
        radial-gradient(ellipse at 12% 72%, rgba(0, 153, 190, .18), transparent 38%),
        radial-gradient(ellipse at 90% 82%, rgba(126, 30, 107, .20), transparent 35%),
        linear-gradient(135deg, #070914 0%, #10162d 48%, #090b19 100%);
      text-align: center; color: #f4f1ff;
      font-family: Arial, sans-serif; overflow-x: hidden; position: relative;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.62) 100%);
    }
    body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .22;
      background-image: radial-gradient(#ffffff 0.7px, transparent 0.7px);
      background-size: 43px 43px;
      mask-image: linear-gradient(to bottom, #000, transparent 85%);
    }
    main { position: relative; z-index: 2; width: min(100%, 1000px); margin: 0 auto; }
    h1 {
      color: #7de7ff; font-size: 10px; font-weight: bold; letter-spacing: 3px;
      text-shadow: 0 0 12px rgba(80, 210, 255, .8); margin: 10px 0 18px;
    }
    .intro {
      color: #e0a8ff; font: 11px "Times New Roman", serif; letter-spacing: 1px;
      margin: 0 0 30px; text-shadow: 0 0 10px rgba(185, 90, 255, .3);
    }
    .qr-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(12px, 3vw, 30px); align-items: stretch; width: 100%;
    }
    .qr-card {
      min-width: 0; margin: 0; padding: clamp(12px, 2vw, 22px);
      border: 1px solid rgba(174, 153, 255, .32); border-radius: 18px;
      background: linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.035));
      box-shadow: 0 18px 45px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(8px);
    }
    .qr-card h2 {
      color: #f0d5ff; font-size: clamp(11px, 1.8vw, 16px); line-height: 1.35;
      letter-spacing: .8px; margin: 0 0 15px; overflow-wrap: anywhere;
      text-shadow: 0 0 12px rgba(188, 112, 255, .3);
    }
    .qr-link { display: inline-block; line-height: 0; border-radius: 8px; outline-offset: 5px; }
    .qr-image {
      display: block; width: min(100%, 300px); height: auto; margin: 0 auto;
      border-radius: 5px; box-shadow: 0 8px 26px rgba(0,0,0,.28);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .qr-link:hover .qr-image, .qr-link:focus-visible .qr-image {
      transform: scale(1.025); box-shadow: 0 0 24px rgba(145, 111, 255, .3);
    }
    .caption { color: #d8c5f4; font: 11px "Times New Roman", serif; line-height: 1.5; margin: 13px 0 0; }
    footer {
      position: relative; z-index: 2; margin: 34px auto 8px; color: #bba6ef;
      font: 12px "Times New Roman", serif; letter-spacing: 1px;
      text-shadow: 0 0 12px rgba(151, 103, 255, .35);
    }
    .heart {
      position: fixed; bottom: -40px; left: 0; pointer-events: none; z-index: 1;
      animation: floatUp linear forwards; filter: drop-shadow(0 0 6px rgba(255,80,180,.55));
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      12% { opacity: .85; }
      100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
    }
    @media (max-width: 520px) {
      body { padding: 24px 10px 16px; }
      .qr-grid { gap: 10px; }
      .qr-card { padding: 10px 7px; border-radius: 12px; }
      .qr-card h2 { font-size: 10px; letter-spacing: .2px; margin-bottom: 10px; }
      .caption { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { .heart { display: none; } .qr-image { transition: none; } }
  </style>
</head>
